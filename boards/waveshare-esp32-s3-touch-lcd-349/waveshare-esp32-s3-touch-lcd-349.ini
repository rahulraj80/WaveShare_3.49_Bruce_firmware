; Waveshare ESP32-S3-Touch-LCD-3.49 V2 (silkscreen "Rev1.1" = V2).
; 172x640 AXS15231B over QSPI, used as 640x172 landscape. Pinout and quirks:
; connections.md next to this file.
[env:waveshare-esp32-s3-touch-lcd-349]
board = waveshare-esp32-s3-touch-lcd-349
board_build.partitions = custom_16Mb.csv
build_src_filter =${env.build_src_filter} +<../boards/waveshare-esp32-s3-touch-lcd-349>
build_flags =
	${env.build_flags}
	-Iboards/waveshare-esp32-s3-touch-lcd-349
	-Os
	-DCORE_DEBUG_LEVEL=1
	-DDISABLE_ALL_LIBRARY_WARNINGS
	-DHAS_TOUCH=1

lib_deps =
	${env.lib_deps}
	https://github.com/bmorcelli/ESP32_Button
	https://github.com/moononournation/Arduino_GFX.git#2ef1b8f958818b4cba66728df4c2f78bb77f0321
