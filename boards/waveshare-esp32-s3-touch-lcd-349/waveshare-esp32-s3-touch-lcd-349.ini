; Waveshare ESP32-S3-Touch-LCD-3.49 V2 (silkscreen "Rev1.1" = V2).
; 172x640 AXS15231B over QSPI, used as 640x172 landscape. Pinout and quirks:
; connections.md next to this file.
[env:waveshare-esp32-s3-touch-lcd-349]
board = waveshare-esp32-s3-touch-lcd-349
board_build.partitions = custom_16Mb.csv
; Debloat (fork): DISABLE_ADDON_MODULES drops the RF/NRF24/LoRa/FM/IR/RFID/GPS/Ethernet
; menus and their code (none of that hardware is fitted); the JS interpreter goes too.
build_src_filter =${env.build_src_filter} +<../boards/waveshare-esp32-s3-touch-lcd-349>
	-<modules/rf/> -<modules/NRF24/> -<modules/lora/> -<modules/fm/> -<modules/ir/>
	-<modules/rfid/> -<modules/gps/> -<modules/bjs_interpreter/>
	-<core/menu_items/RFMenu.cpp> -<core/menu_items/NRF24.cpp> -<core/menu_items/LoRaMenu.cpp>
	-<core/menu_items/FMMenu.cpp> -<core/menu_items/IRMenu.cpp> -<core/menu_items/RFIDMenu.cpp>
	-<core/menu_items/GpsMenu.cpp> -<core/menu_items/EthernetMenu.cpp>
	-<core/serial_commands/rf_commands.cpp> -<core/serial_commands/ir_commands.cpp>
	-<core/serial_commands/rfid_commands.cpp>
build_flags =
	${env.build_flags}
	-Iboards/waveshare-esp32-s3-touch-lcd-349
	-Os
	-DCORE_DEBUG_LEVEL=1
	-DDISABLE_ALL_LIBRARY_WARNINGS
	-DHAS_TOUCH=1
	; Debloat (fork): no JS interpreter; IR limited to the common protocols (as env_4mb)
	-DDISABLE_INTERPRETER
	-DDISABLE_ADDON_MODULES
	-D_IR_ENABLE_DEFAULT_=false
	-DDECODE_HASH=true
	-DDECODE_NEC=true
	-DSEND_NEC=true
	-DDECODE_SAMSUNG=true
	-DSEND_SAMSUNG=true
	-DDECODE_RC5=true
	-DSEND_RC5=true
	-DDECODE_RC6=true
	-DSEND_RC6=true
	-DDECODE_LG=true
	-DSEND_LG=true
	-DDECODE_SONY=true
	-DSEND_SONY=true
	-DSEND_PANASONIC=true
	-DDECODE_PANASONIC=true
	-DSEND_RAW=true

lib_deps =
	${env.lib_deps}
	https://github.com/bmorcelli/ESP32_Button
	https://github.com/moononournation/Arduino_GFX.git#2ef1b8f958818b4cba66728df4c2f78bb77f0321

; No RGB LED on this board (FastLED is only used with HAS_RGB_LED), no
; speaker (ESP8266Audio/SAM are only used with HAS_NS4168_SPKR), and
; FastLED 3.10.8 clashes with the FP font-size macro from pins_arduino.h.
lib_ignore =
	FastLED
	ESP8266Audio
	ESP8266SAM
